# Serve a static site with as few round trips as possible.
#
# tcp_fastopen = 3 lets the server accept data in the SYN packet (the web tier
# asks for TCP_FASTOPEN on its listeners) and lets local clients use it too.
# somaxconn matches the 4096 listen backlog the web tier requests.
net.ipv4.tcp_fastopen = 3
net.core.somaxconn = 4096
net.ipv4.tcp_tw_reuse = 1
net.core.netdev_max_backlog = 4096
